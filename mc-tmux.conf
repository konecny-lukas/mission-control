# Mission Control — persistent terminal sessions.
# Dedicated tmux server (socket `-L mc`), isolated from the user's own tmux.
# Goal: behave like a plain terminal that simply survives browser/tab close.
#
# NOTE: tmux applies a config only when the SERVER starts. After editing this
# file, reload the mc terminals with:  tmux -L mc kill-server
# (this ends all running mission-control sessions).

set  -g  default-terminal "tmux-256color"
set  -g  status off                # no status bar — looks like a normal terminal
# Scrolling: the conversation history lives in tmux's own scrollback (it survives
# detach/reattach — xterm.js cannot, it starts empty on every reconnect). So the
# only way to see history is tmux copy-mode. `mouse on` lets a real terminal's
# wheel drive it; in our iframe the wheel doesn't reach tmux, so Mission Control
# drives copy-mode server-side via the `term.scroll` action (tmux send-keys -X).
set  -g  mouse on                  # wheel/select in a real terminal; iframe uses term.scroll
set  -g  history-limit 50000       # generous scrollback for long Claude runs
set  -g  escape-time 10            # snappy ESC handling for the Claude TUI
set  -g  destroy-unattached off    # keep sessions alive after the browser detaches
set  -g  window-size latest        # size to the most recent client (clean reattach)
setw -g  aggressive-resize on
